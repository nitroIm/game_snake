<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Крипто-Змейка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
            padding: 10px;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 400px;
            padding: 6px 0;
            gap: 10px;
        }

        #header {
            display: flex;
            gap: 16px;
            font-size: 16px;
            font-weight: bold;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background-color: var(--tg-theme-secondary-bg-color, #2a2a2a);
            color: var(--tg-theme-text-color, #ffffff);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        .icon-btn:active { opacity: 0.7; }

        #game {
            background-color: var(--tg-theme-secondary-bg-color, #2a2a2a);
            border-radius: 12px;
            touch-action: none;
        }

        #controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        #controls .row { display: flex; gap: 10px; }

        .ctrl {
            width: 60px;
            height: 60px;
            font-size: 24px;
            border: none;
            border-radius: 12px;
            background-color: var(--tg-theme-button-color, #4a86ff);
            color: var(--tg-theme-button-text-color, #ffffff);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .ctrl:active { opacity: 0.7; }

        #overlay, #pause-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 100;
        }

        #overlay { background: rgba(0,0,0,0.8); }
        #pause-overlay { background: rgba(0,0,0,0.6); z-index: 90; }

        #overlay.hidden, #pause-overlay.hidden { display: none; }

        #overlay h2 { font-size: 28px; }
        #overlay p { font-size: 18px; }
        #pause-overlay h2 { font-size: 32px; }

        .overlay-btn {
            padding: 14px 32px;
            background-color: var(--tg-theme-button-color, #4a86ff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .overlay-btn.secondary {
            background-color: var(--tg-theme-secondary-bg-color, #2a2a2a);
        }
    </style>
</head>
<body>
    <div id="top-bar">
        <div id="header">
            <div>Баланс: <span id="score">0</span> 💰</div>
            <div>Рекорд: <span id="best">0</span></div>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="icon-btn" id="pause-btn">⏸</button>
            <button class="icon-btn" id="close-btn">✕</button>
        </div>
    </div>

    <canvas id="game"></canvas>

    <div id="controls">
        <button class="ctrl" data-dir="up">▲</button>
        <div class="row">
            <button class="ctrl" data-dir="left">◀</button>
            <button class="ctrl" data-dir="down">▼</button>
            <button class="ctrl" data-dir="right">▶</button>
        </div>
    </div>

    <div id="pause-overlay" class="hidden">
        <h2>⏸ Пауза</h2>
        <button class="overlay-btn" id="resume-btn">Продолжить</button>
    </div>

    <div id="overlay" class="hidden">
        <h2 id="overlay-title">Игра окончена</h2>
        <p id="overlay-text">Ваш баланс: 0</p>
        <button class="overlay-btn" id="restart-btn">Играть снова</button>
        <button class="overlay-btn secondary" id="exit-btn">Выйти</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp || {
            ready:()=>{}, expand:()=>{}, close:()=>{},
            HapticFeedback:{impactOccurred:()=>{},notificationOccurred:()=>{}},
            sendData:()=>{}
        };
        tg.ready?.();
        tg.expand?.();

        const SAVE_KEY = 'snakeSave';
        const BEST_KEY = 'snakeBest';

        // Крипто-символы, которые ест змейка
        const FOODS = [
            { icon: '₿', name: 'Bitcoin', value: 100 },
            { icon: 'Ξ', name: 'Ethereum', value: 80 },
            { icon: '🪙', name: 'Coin', value: 50 },
            { icon: '💎', name: 'Diamond', value: 70 },
            { icon: '🚀', name: 'Rocket', value: 60 },
            { icon: '⚡', name: 'Thor', value: 90 },
            { icon: '🔨', name: 'Mjolnir', value: 85 },
            { icon: '🐕', name: 'Doge', value: 40 },
            { icon: '🔥', name: 'Fire', value: 30 }
        ];

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        let cellSize;

        let snake, direction, nextDirection, food, score, best, running, paused, loopId;
        best = parseInt(localStorage.getItem(BEST_KEY) || '0');

        // === СОХРАНЕНИЕ / ЗАГРУЗКА ===
        function saveGame() {
            if (!running) return;
            const state = {
                snake, direction, nextDirection, food, score,
                savedAt: Date.now()
            };
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify(state));
            } catch(e) { console.warn('Не удалось сохранить', e); }
        }

        function loadGame() {
            try {
                const raw = localStorage.getItem(SAVE_KEY);
                if (!raw) return null;
                const state = JSON.parse(raw);
                if (!state.snake || !Array.isArray(state.snake)) return null;
                if (typeof state.score !== 'number') return null;
                return state;
            } catch(e) { return null; }
        }

        function clearSave() {
            localStorage.removeItem(SAVE_KEY);
        }

        function resumeSaved(state) {
            snake = state.snake;
            direction = state.direction;
            nextDirection = state.nextDirection;
            food = state.food;
            score = state.score;
            running = true;
            paused = false;
            updateUI();
            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('pause-overlay').classList.add('hidden');
            document.getElementById('pause-btn').textContent = '⏸';
            clearInterval(loopId);
            loopId = setInterval(tick, 200);
            draw();
        }

        // === ОСНОВНАЯ ЛОГИКА ===
        function resize() {
            const size = Math.min(window.innerWidth - 40, window.innerHeight - 340);
            canvas.width = size;
            canvas.height = size;
            cellSize = size / gridSize;
            if (snake) draw();
        }

        function initGame() {
            snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
            direction = {x: 1, y: 0};
            nextDirection = {x: 1, y: 0};
            score = 0;
            running = true;
            paused = false;
            placeFood();
            updateUI();
            clearSave();
            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('pause-overlay').classList.add('hidden');
            document.getElementById('pause-btn').textContent = '⏸';
            clearInterval(loopId);
            loopId = setInterval(tick, 200);
            draw();
        }

        function placeFood() {
            let x, y;
            do {
                x = Math.floor(Math.random() * gridSize);
                y = Math.floor(Math.random() * gridSize);
            } while (snake.some(s => s.x === x && s.y === y));

            // Случайный крипто-символ
            const randomFood = FOODS[Math.floor(Math.random() * FOODS.length)];
            food = {
                x, y,
                icon: randomFood.icon,
                name: randomFood.name,
                value: randomFood.value
            };
        }

        function tick() {
            if (!running || paused) return;
            direction = nextDirection;
            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

            if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                return gameOver();
            }
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                return gameOver();
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += food.value;
                updateUI();
                placeFood();
                tg.HapticFeedback?.impactOccurred?.('light');
            } else {
                snake.pop();
            }
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Еда — крипто-символ
            ctx.font = `${cellSize * 0.85}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(
                food.icon,
                food.x * cellSize + cellSize / 2,
                food.y * cellSize + cellSize / 2
            );

            // Змейка — золотая, как будто из монет
            snake.forEach((s, i) => {
                if (i === 0) {
                    ctx.fillStyle = '#f1c40f'; // голова — золото
                } else {
                    // Тело — переливы золота
                    const shade = 200 + (i % 3) * 15;
                    ctx.fillStyle = `rgb(${shade}, ${shade - 40}, 0)`;
                }
                ctx.fillRect(s.x * cellSize + 1, s.y * cellSize + 1, cellSize - 2, cellSize - 2);
            });
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('best').textContent = best;
        }

        function gameOver() {
            running = false;
            clearInterval(loopId);
            tg.HapticFeedback?.notificationOccurred?.('error');
            clearSave();

            if (score > best) {
                best = score;
                localStorage.setItem(BEST_KEY, best);
                updateUI();
            }

            document.getElementById('overlay-title').textContent = '💀 Игра окончена';
            document.getElementById('overlay-text').textContent = 'Ваш баланс: ' + score + ' 💰';
            document.getElementById('overlay').classList.remove('hidden');

            tg.sendData?.(JSON.stringify({ game: 'crypto-snake', score }));
        }

        function togglePause() {
            if (!running) return;
            paused = !paused;
            document.getElementById('pause-overlay').classList.toggle('hidden', !paused);
            document.getElementById('pause-btn').textContent = paused ? '▶' : '⏸';
            if (paused) saveGame();
            tg.HapticFeedback?.impactOccurred?.('light');
        }

        // === ОБРАБОТЧИКИ ===
        document.getElementById('pause-btn').addEventListener('click', togglePause);
        document.getElementById('resume-btn').addEventListener('click', togglePause);

        document.getElementById('close-btn').addEventListener('click', () => {
            if (running) {
                paused = true;
                saveGame();
                clearInterval(loopId);
            }
            tg.close?.();
        });

        document.getElementById('exit-btn').addEventListener('click', () => {
            clearSave();
            tg.close?.();
        });

        document.querySelectorAll('.ctrl').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                if (paused) return;
                const dir = btn.dataset.dir;
                let newDir;
                if (dir === 'up') newDir = {x: 0, y: -1};
                if (dir === 'down') newDir = {x: 0, y: 1};
                if (dir === 'left') newDir = {x: -1, y: 0};
                if (dir === 'right') newDir = {x: 1, y: 0};

                if (direction.x + newDir.x === 0 && direction.y + newDir.y === 0) return;
                nextDirection = newDir;
                tg.HapticFeedback?.impactOccurred?.('light');
            });
        });

        let touchStart = null;
        document.addEventListener('touchstart', e => {
            touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
        }, {passive: true});

        document.addEventListener('touchend', e => {
            if (!touchStart || paused) return;
            const dx = e.changedTouches[0].clientX - touchStart.x;
            const dy = e.changedTouches[0].clientY - touchStart.y;
            touchStart = null;

            if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;

            let dir;
            if (Math.abs(dx) > Math.abs(dy)) {
                dir = dx > 0 ? {x: 1, y: 0} : {x: -1, y: 0};
            } else {
                dir = dy > 0 ? {x: 0, y: 1} : {x: 0, y: -1};
            }
            if (direction.x + dir.x === 0 && direction.y + dir.y === 0) return;
            nextDirection = dir;
        }, {passive: true});

        document.getElementById('restart-btn').addEventListener('click', initGame);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && running) {
                paused = true;
                saveGame();
                document.getElementById('pause-overlay').classList.remove('hidden');
                document.getElementById('pause-btn').textContent = '▶';
            }
        });
        window.addEventListener('beforeunload', () => { if (running) saveGame(); });
        window.addEventListener('pagehide', () => { if (running) saveGame(); });

        window.addEventListener('resize', resize);

        // === СТАРТ ===
        resize();
        const saved = loadGame();
        if (saved) {
            document.getElementById('overlay-title').textContent = 'Продолжить игру?';
            document.getElementById('overlay-text').textContent =
                `Найдено сохранение: баланс ${saved.score} 💰`;
            document.getElementById('overlay').classList.remove('hidden');
            document.getElementById('restart-btn').textContent = 'Продолжить';
            document.getElementById('restart-btn').onclick = () => resumeSaved(saved);

            const exitBtn = document.getElementById('exit-btn');
            exitBtn.textContent = 'Новая игра';
            exitBtn.onclick = () => {
                clearSave();
                initGame();
                document.getElementById('restart-btn').textContent = 'Играть снова';
                document.getElementById('restart-btn').onclick = initGame;
                exitBtn.textContent = 'Выйти';
                exitBtn.onclick = () => { clearSave(); tg.close?.(); };
            };
        } else {
            initGame();
        }
    </script>
</body>
</html>
