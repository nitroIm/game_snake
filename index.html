<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Крипто-Змейка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="top-bar">
        <div id="header">
            <div>Баланс: <span id="score">0</span> 💰</div>
            <div>Рекорд: <span id="best">0</span></div>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="icon-btn" id="pause-btn">⏸</button>
            <button class="icon-btn" id="close-btn">✕</button>
        </div>
    </div>

    <canvas id="game"></canvas>

    <div id="controls">
        <button class="ctrl" data-dir="up">▲</button>
        <div class="row">
            <button class="ctrl" data-dir="left">◀</button>
            <button class="ctrl" data-dir="down">▼</button>
            <button class="ctrl" data-dir="right">▶</button>
        </div>
    </div>

    <div id="pause-overlay" class="hidden">
        <h2>⏸ Пауза</h2>
        <button class="overlay-btn" id="resume-btn">Продолжить</button>
    </div>

    <div id="overlay" class="hidden">
        <h2 id="overlay-title">Игра окончена</h2>
        <p id="overlay-text">Ваш баланс: 0</p>
        <button class="overlay-btn" id="restart-btn">Играть снова</button>
        <button class="overlay-btn secondary" id="exit-btn">Выйти</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
